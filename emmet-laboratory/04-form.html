<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="POST">
        <div>
            <label for="studentid">Student ID:</label><br>
            <input type="text" id="studentid" name="studentid" required placeholder="Enter student ID">
        </div>
        <br>

        <div>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter full name">
        </div>
        <br>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Enter email">
        </div>
        <br>

        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <br>

        <div>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male"> <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female"> <label for="female">Female</label>
        </div>
        <br>

        <div>
            <label for="course">Course / Program:</label><br>
            <input type="text" id="course" name="course" placeholder="e.g., BSIT">
        </div>
        <br>

        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="hobby1" name="hobbies" value="Coding"> <label for="hobby1">Coding</label>
            <input type="checkbox" id="hobby2" name="hobbies" value="Gaming"> <label for="hobby2">Gaming</label>
        </div>
        <br>

        <div>
            <label for="address">Address:</label><br>
            <input type="text" id="address" name="address" placeholder="Enter address">
        </div>
        <br>

        <div>
            <input type="submit" value="Register">
        </div>
    </form>
</body>
</html>
