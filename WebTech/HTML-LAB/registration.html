<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab_Activity_7:_HTML_FORMS</title>
</head>
<h1>Lab Activity 7: HTML Forms</h1>
<body>
    <h1>Student Registration</h1>
    <p>Please fill out the form below to register for the upcoming semester.</p>

    <form action="#" method="post">
        <div>
            <label for="Fullname">Full Name:</label><br>
            <input type="text" id="Fullname" name="Fullname" required minlength="2" maxlength="50" placeholder="e.g., Juan Dela Cruz">
        </div>
        <br>
        <div>
            <label for="studentid">Student ID:</label><br>
            <input type="text" id="studentid" name="studentid" required placeholder="e.g., 2*-2***-2**">
        </div>
        <br>
        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required placeholder="student@example.com">
        </div>
        <br>
        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
        </div>
        <br>
        <div>
            <label for="birthday">Birthday:</label><br>
            <input type="date" id="birthday" name="birthday" required>
        </div>
        <br>
        <div>
            <label>Gender:</label><br>
            <input type="radio" id="Male" name="Gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>
        <br>
        <div>
            <label for="program">Program/Course</label><br>
            <select name="program" id="program" required>
                <option value="">Select Your Program</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
            </select>
        </div>
        <div>
            <label for="address">Address</label><br>
            <textarea name="adress" id="address" rows="3" placeholder="Enter your complete home address"></textarea>  
        </div>
        <div>
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</Form></button>
        </div>
    </form>
</body>
</html>
