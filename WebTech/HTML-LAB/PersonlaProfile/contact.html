    <hr>
    <main>
        <h1>Contact Me</h1>
        <p>Have a question or want to collaborate? Fill out tje form below to reach out!</p>
        <form action="#" method="post">
            <div>
                <label for="name">Name</label><br>
                <input type="text" name="name" id="name" required placeholder="Your full name">
            </div>
            <br>
            <div>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>
            <div>
                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required placeholder="Subject of your message">
            </div>
            <br>
            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
            </div>
            <br>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>
