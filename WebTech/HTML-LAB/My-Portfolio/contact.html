<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a> | 
        <a href="about.html">ABOUT</a> | 
        <a href="education.html">EDUCATION</a> | 
        <a href="skills.html">SKILLS</a> | 
        <a href="contact.html">CONTACT</a>
    </nav>
    <hr>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>If you would like to collaborate or have any inquiries, please fill out the form below:</p>

            <!-- Functional-looking HTML Form Requirement -->
            <form action="#" method="POST">
                <div>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required placeholder="Your full name">
                </div>
                <br>

                <div>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                </div>
                <br>

                <div>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" required placeholder="Message subject">
                </div>
                <br>

                <div>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>
                <br>

                <div>
                    <button type="submit">Send Message</button>
                    <button type="reset">Clear Form</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
